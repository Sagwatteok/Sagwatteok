name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_profile_stats.py'
      - '.github/workflows/profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate public statistics
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_stats.py
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-statistics.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update public profile statistics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

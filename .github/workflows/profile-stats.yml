name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 20 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_profile_stats.py'
      - '.github/workflows/profile-stats.yml'
      - 'scripts/stats-templates/**'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile statistics
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.PROFILE_STATS_TOKEN != '' }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_profile_stats.py
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-statistics.svg assets/github-languages.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update public profile statistics'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
